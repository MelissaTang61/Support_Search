<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="輸入客戶關鍵字，快速查詢議題負責的 SA、後端與前端 PG。"
    />
    <title>議題分工查詢台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="議題分工查詢台首頁">
          <span class="brand-mark" aria-hidden="true">分</span>
          <span>議題分工查詢台</span>
        </a>
        <span class="data-badge">資料更新：2026.10.30</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div class="eyebrow"><span></span> ASSIGNMENT FINDER</div>
          <h1 id="page-title">找到客戶，<br /><em>立即找到負責人。</em></h1>
          <p class="hero-copy">
            輸入客戶名稱或專案關鍵字，快速確認 SA 與前、後端 PG 分工。
          </p>

          <form class="search-panel" id="search-form" role="search">
            <label for="customer-search">客戶關鍵字</label>
            <div class="search-row">
              <div class="input-wrap">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-4-4"></path>
                </svg>
                <input
                  id="customer-search"
                  name="keyword"
                  type="search"
                  placeholder="例如：日月光、台灣半導體、華城電機"
                  autocomplete="off"
                  enterkeyhint="search"
                />
                <button class="clear-button" id="clear-button" type="button" aria-label="清除搜尋">
                  ×
                </button>
              </div>
              <button class="search-button" type="submit">
                查詢負責人
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M5 12h14M14 7l5 5-5 5"></path>
                </svg>
              </button>
            </div>
            <div class="suggestions" aria-label="搜尋範例">
              <span>快速試試</span>
              <button type="button" data-query="日月光">日月光</button>
              <button type="button" data-query="統一">統一</button>
              <button type="button" data-query="中鋼碳素">中鋼碳素</button>
            </div>
          </form>
        </section>

        <section class="results-section" aria-labelledby="results-title">
          <div class="results-heading">
            <div>
              <p class="section-kicker">SEARCH RESULT</p>
              <h2 id="results-title">查詢結果</h2>
            </div>
            <p id="result-summary">輸入關鍵字開始查詢</p>
          </div>

          <div id="results" class="results" aria-live="polite">
            <div class="empty-state">
              <div class="empty-icon" aria-hidden="true">
                <span></span><span></span><span></span>
              </div>
              <h3>準備好開始查詢</h3>
              <p>輸入至少一個關鍵字，我們會列出所有符合的議題分工。</p>
            </div>
          </div>
        </section>
      </main>

      <footer>
        <p>共收錄 <strong id="record-count">0</strong> 筆議題分工</p>
        <p>依《議題分配表》整理 · 請以最新內部公告為準</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
